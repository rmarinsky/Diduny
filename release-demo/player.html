<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Diduny release montage</title>
<!-- Plays window.SCENARIO (scenario.js). Open directly to preview (loops); ?t=<ms> freezes every
     animation at that moment so scripts/render_release_gif.py can capture frames deterministically. -->
<style>
:root{ --bg:#141414; --bar:#181818; --text:#f5f5f5; --text2:#a9a9ae; --accent:#d6506c; }
*{box-sizing:border-box;margin:0}
html,body{width:960px;height:800px;overflow:hidden;background:var(--bg);color:var(--text);
  font:16px/1.3 -apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;-webkit-font-smoothing:antialiased}
.view{position:absolute;left:0;top:0;width:960px;height:683px;overflow:hidden;background:var(--bg)}
.shot{position:absolute;inset:0;opacity:0}
.cam{position:absolute;left:0;top:0;width:960px;height:683px;transform-origin:0 0}
.cam img{width:960px;height:683px;display:block}
.mask{position:absolute;backdrop-filter:blur(9px) brightness(.75);-webkit-backdrop-filter:blur(9px) brightness(.75);border-radius:8px}
.hl{position:absolute;border:3px solid var(--accent);border-radius:10px;box-shadow:0 0 0 9999px rgba(0,0,0,.45);opacity:0}
.tap{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;border:3px solid var(--accent);opacity:0}
.keys{position:absolute;left:0;right:0;bottom:36px;display:flex;justify-content:center;gap:14px}
.key{min-width:92px;height:92px;padding:0 20px;border-radius:20px;background:#2b2b2b;border:1px solid rgba(255,255,255,.18);
  border-bottom:6px solid #0e0e0e;display:grid;place-items:center;font-size:46px;font-weight:600;color:#fff;opacity:0;
  box-shadow:0 18px 40px rgba(0,0,0,.55)}
.bar{position:absolute;left:0;right:0;bottom:0;height:117px;background:var(--bar);border-top:1px solid rgba(255,255,255,.06)}
.bar::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--accent)}
.sub{position:absolute;left:30px;right:24px;top:20px;opacity:0}
.sub .uk{font-size:31px;font-weight:700;letter-spacing:-.01em}
.sub .en{font-size:21px;color:var(--text2);margin-top:6px}
.end{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;opacity:0;background:var(--bg)}
.end .logo{width:84px;height:84px;border-radius:22px;background:var(--accent);display:grid;place-items:center;font-size:44px}
.end .t{font-size:54px;font-weight:800;letter-spacing:-.02em}
</style>
</head>
<body>
<div class="view" id="view"></div>
<div class="bar" id="bar"></div>
<script src="scenario.js"></script>
<script>
const OUT = 'cubic-bezier(0.23, 1, 0.32, 1)';       // entrances, feedback
const IN_OUT = 'cubic-bezier(0.77, 0, 0.175, 1)';   // camera moves, screen-to-screen
const REDUCE = matchMedia('(prefers-reduced-motion: reduce)').matches;
const W = 960, H = 683, SX = W / 1000, SY = H / 712;
const view = document.getElementById('view'), bar = document.getElementById('bar');
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
const at = (node, frames, start, duration, easing = OUT, fill = 'both') =>
  node.animate(REDUCE ? frames.map(({ transform, ...r }) => r) : frames, { delay: start, duration, easing, fill });

// Camera transform that fits rect [x,y,w,h] (window space) into the view with a little margin.
function cam(rect) {
  if (rect === 'full') return 'translate(0px,0px) scale(1)';
  const [x, y, w, h] = rect;
  const s = Math.min(W / (w * SX), H / (h * SY)) * 0.92;
  const cx = (x + w / 2) * SX, cy = (y + h / 2) * SY;
  return `translate(${W / 2 - cx * s}px,${H / 2 - cy * s}px) scale(${s})`;
}
const toView = (rect, camRect) => { // rect in window space → px inside the view under the given camera
  const m = new DOMMatrix(cam(camRect)); const [x, y, w, h] = rect;
  const p = m.transformPoint({ x: x * SX, y: y * SY }), q = m.transformPoint({ x: (x + w) * SX, y: (y + h) * SY });
  return { left: p.x, top: p.y, width: q.x - p.x, height: q.y - p.y };
};

let t = 0, lastSub = null;
for (const s of window.SCENARIO.scenes) {
  const t0 = t, t1 = t + s.duration;
  if (s.end) {
    const end = view.appendChild(el('div', 'end', `<div class="logo">🎙</div><div class="t">${window.SCENARIO.title}</div>`));
    at(end, [{ opacity: 0, transform: 'scale(0.96)' }, { opacity: 1, transform: 'none' }], t0, 500);
  } else {
    const shot = view.appendChild(el('div', 'shot'));
    const c = shot.appendChild(el('div', 'cam', `<img src="frames/${s.frame}.png">`));
    // enter: slide (new screen) or crossfade (same screen, new state)
    if (s.enter === 'slide') {
      at(shot, [{ opacity: 1, transform: 'translateX(100%)' }, { opacity: 1, transform: 'none' }], t0, 600, IN_OUT);
    } else {
      at(shot, [{ opacity: 0 }, { opacity: 1 }], t0, s.enter === 'fade' ? 280 : 1, OUT);
    }
    // camera keyframes
    let last = null;
    for (const [dt, rect] of s.camera) {
      if (last === null) { at(c, [{ transform: cam(rect) }, { transform: cam(rect) }], t0, 1, 'linear'); }
      else { at(c, [{ transform: cam(last) }, { transform: cam(rect) }], t0 + dt, 750, IN_OUT, 'forwards'); }
      last = rect;
    }
    const finalCam = last;
    // Masks are drawn inside the camera layer so they move with the frame (hide real notes, etc.).
    for (const [x, y, w, h] of s.masks || []) {
      const m = c.appendChild(el('div', 'mask'));
      Object.assign(m.style, { left: x * SX + 'px', top: y * SY + 'px', width: w * SX + 'px', height: h * SY + 'px' });
    }
    if (s.highlight) {
      const r = toView(s.highlight.rect, finalCam);
      const hl = shot.appendChild(el('div', 'hl'));
      Object.assign(hl.style, { left: r.left - 6 + 'px', top: r.top - 6 + 'px', width: r.width + 12 + 'px', height: r.height + 12 + 'px' });
      at(hl, [{ opacity: 0, transform: 'scale(1.04)' }, { opacity: 1, transform: 'none' }], t0 + s.highlight.at + 300, 320);
    }
    if (s.tap) {
      const r = toView([s.tap.x, s.tap.y, 0, 0], finalCam);
      const tap = shot.appendChild(el('div', 'tap'));
      Object.assign(tap.style, { left: r.left + 'px', top: r.top + 'px' });
      at(tap, [{ opacity: 0.9, transform: 'scale(0.6)' }, { opacity: 0, transform: 'scale(1.6)' }], t0 + s.tap.at, 520);
    }
    if (s.keys) {
      const row = shot.appendChild(el('div', 'keys'));
      s.keys.keys.forEach((k, i) => {
        const key = row.appendChild(el('div', 'key', k));
        at(key, [{ opacity: 0, transform: 'translateY(16px) scale(0.96)' }, { opacity: 1, transform: 'none' }], t0 + s.keys.at + i * 70, 320);
        const press = t0 + s.keys.at + 700;
        at(key, [{ transform: 'none' }, { transform: 'translateY(5px) scale(0.95)' }], press, 110, OUT, 'forwards');
        at(key, [{ transform: 'translateY(5px) scale(0.95)' }, { transform: 'none' }], press + 260, 180, OUT, 'forwards');
        at(key, [{ opacity: 1 }, { opacity: 0 }], t1 - 260, 220, OUT, 'forwards');
      });
    }
    at(shot, [{ opacity: 1 }, { opacity: 0 }], t1 + 280, 1, 'linear', 'forwards'); // hidden once the next scene covers it
  }
  // subtitles: change only when the text changes; optional second line pair later in the scene
  const lines = [[s.uk, s.en, t0], ...(s.uk2 ? [[s.uk2, s.en2, t0 + s.duration * 0.55]] : [])];
  for (const [uk, en, start] of lines) {
    if (!uk || uk === lastSub?.uk) continue;
    if (lastSub) at(lastSub.node, [{ opacity: 1 }, { opacity: 0 }], start, 180, OUT, 'forwards');
    const node = bar.appendChild(el('div', 'sub', `<div class="uk">${uk}</div><div class="en">${en}</div>`));
    at(node, [{ opacity: 0, transform: 'translateY(8px)' }, { opacity: 1, transform: 'none' }], start + 120, 320);
    lastSub = { uk, node };
  }
  t = t1;
}
window.TOTAL_MS = t;

const seek = new URLSearchParams(location.search).get('t');
if (seek !== null) document.getAnimations().forEach(a => { a.pause(); a.currentTime = Number(seek); });
else setTimeout(() => location.reload(), t + 600);
</script>
</body>
</html>
