name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Every release writes the shared gh-pages appcast, so serialize all tags.
  group: release
  cancel-in-progress: false

env:
  APP_NAME: Diduny
  DISPLAY_NAME: Diduny
  SCHEME: Diduny
  PROJECT_FILE: Diduny.xcodeproj
  APP_BUNDLE_NAME: Diduny.app
  ARCHIVE_PATH: build/Diduny.xcarchive
  EXPORT_DIR: build/export
  KEYCHAIN_NAME: build.keychain-db
  USES_XCODEGEN: "true"

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare curated release notes
        run: |
          python3 scripts/release_highlights.py render \
            Diduny/Resources/ReleaseHighlights.json \
            build/release-notes.md
          # Every release shows its "What's new" GIF (rendered by scripts/render_release_gif.sh).
          { echo "![What's new in ${GITHUB_REF_NAME}](https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/whats-new.gif)"; echo; cat build/release-notes.md; } > build/notes-with-gif.md
          mv build/notes-with-gif.md build/release-notes.md
          cp Diduny/Resources/ReleaseDemo.gif build/whats-new.gif

      - name: Select Xcode
        run: |
          sudo xcode-select -switch /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Validate required secrets
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          SPARKLE_EDDSA_PRIVATE_KEY: ${{ secrets.SPARKLE_EDDSA_PRIVATE_KEY }}
        run: |
          for var in APPLE_ID APPLE_APP_PASSWORD APPLE_TEAM_ID MACOS_CERTIFICATE_P12 MACOS_CERTIFICATE_PASSWORD SPARKLE_EDDSA_PRIVATE_KEY; do
            if [ -z "${!var}" ]; then
              echo "::error::Missing required secret: ${var}"
              exit 1
            fi
          done

      - name: Import Developer ID certificate
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > certificate.p12

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_NAME"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"
          security default-keychain -s "$KEYCHAIN_NAME"
          security list-keychains -d user -s "$KEYCHAIN_NAME" login.keychain-db

          security import certificate.p12 \
            -k "$KEYCHAIN_NAME" \
            -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security \
            -T /usr/bin/productbuild

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_NAME"

          security find-identity -v -p codesigning "$KEYCHAIN_NAME"

      - name: Store notarization credentials
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          KEYCHAIN_PATH="$(security list-keychains -d user | head -1 | tr -d '[:space:]"')"
          xcrun notarytool store-credentials "$APP_NAME" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --keychain "$KEYCHAIN_PATH"

      - name: Generate Xcode project (XcodeGen)
        if: env.USES_XCODEGEN == 'true'
        run: |
          brew install xcodegen
          xcodegen generate --quiet

      - name: Resolve packages
        run: xcodebuild -resolvePackageDependencies -project "$PROJECT_FILE" -scheme "$SCHEME"

      - name: Archive universal app
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          BUILD_NUMBER=$(git rev-list --count HEAD)
          # The git tag is the single source of truth for the version —
          # project.yml's MARKETING_VERSION is just a placeholder.
          MARKETING_VERSION="${GITHUB_REF_NAME#v}"
          xcodebuild archive \
            -project "$PROJECT_FILE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -archivePath "$ARCHIVE_PATH" \
            -destination "generic/platform=macOS" \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            MARKETING_VERSION="$MARKETING_VERSION"

      - name: Export and verify app
        run: |
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_DIR" \
            -exportOptionsPlist ExportOptions.plist

          echo "Architectures:"
          lipo -archs "$EXPORT_DIR/$APP_BUNDLE_NAME/Contents/MacOS/$APP_NAME"

          codesign --verify --deep --strict --verbose=2 "$EXPORT_DIR/$APP_BUNDLE_NAME"

      - name: Notarize and staple
        run: |
          ditto -c -k --keepParent "$EXPORT_DIR/$APP_BUNDLE_NAME" "build/${APP_NAME}-notary.zip"

          KEYCHAIN_PATH="$(security list-keychains -d user | head -1 | tr -d '[:space:]"')"
          xcrun notarytool submit "build/${APP_NAME}-notary.zip" \
            --keychain-profile "$APP_NAME" \
            --keychain "$KEYCHAIN_PATH" \
            --wait

          xcrun stapler staple "$EXPORT_DIR/$APP_BUNDLE_NAME"
          spctl --assess --type exec --verbose "$EXPORT_DIR/$APP_BUNDLE_NAME"

      - name: Create DMG
        run: |
          brew install create-dmg
          VERSION=${GITHUB_REF_NAME#v}

          # Stage ONLY the .app — never point create-dmg at $EXPORT_DIR
          # itself, because xcodebuild also drops DistributionSummary.plist,
          # ExportOptions.plist and Packaging.log there and create-dmg
          # would package the lot.
          STAGE_DIR="build/dmg-stage"
          rm -rf "$STAGE_DIR"
          mkdir -p "$STAGE_DIR"
          cp -R "$EXPORT_DIR/$APP_BUNDLE_NAME" "$STAGE_DIR/"

          create-dmg \
            --volname "$DISPLAY_NAME" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "$APP_BUNDLE_NAME" 175 190 \
            --app-drop-link 425 190 \
            "build/${DISPLAY_NAME}-${VERSION}.dmg" \
            "$STAGE_DIR/"

          shasum -a 256 "build/${DISPLAY_NAME}-${VERSION}.dmg" | awk '{print $1}' > "build/${DISPLAY_NAME}-${VERSION}.sha256"

      - name: Sign DMG with Sparkle EdDSA
        env:
          SPARKLE_EDDSA_PRIVATE_KEY: ${{ secrets.SPARKLE_EDDSA_PRIVATE_KEY }}
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          DMG_PATH="build/${DISPLAY_NAME}-${VERSION}.dmg"

          # Download Sparkle tools
          SPARKLE_VERSION="2.9.0"
          curl -sL "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz" -o sparkle.tar.xz
          mkdir -p sparkle_tools
          tar -xf sparkle.tar.xz -C sparkle_tools

          # Sign the DMG and capture signature info
          SIGN_OUTPUT=$(echo "$SPARKLE_EDDSA_PRIVATE_KEY" | sparkle_tools/bin/sign_update "$DMG_PATH" -f -)
          echo "Sparkle signature: $SIGN_OUTPUT"
          # Use heredoc for safe GITHUB_ENV (output contains quotes and special chars)
          {
            echo 'SPARKLE_SIGN_OUTPUT<<SPARKLE_EOF'
            echo "$SIGN_OUTPUT"
            echo 'SPARKLE_EOF'
          } >> "$GITHUB_ENV"

      - name: Create or update GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=${GITHUB_REF_NAME#v}

          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" \
              "build/${DISPLAY_NAME}-${VERSION}.dmg" \
              "build/${DISPLAY_NAME}-${VERSION}.sha256" \
              build/whats-new.gif \
              --clobber
            gh release edit "${GITHUB_REF_NAME}" \
              --title "${APP_NAME} ${VERSION}" \
              --notes-file build/release-notes.md
          else
            gh release create "${GITHUB_REF_NAME}" \
              "build/${DISPLAY_NAME}-${VERSION}.dmg" \
              "build/${DISPLAY_NAME}-${VERSION}.sha256" \
              build/whats-new.gif \
              --title "${APP_NAME} ${VERSION}" \
              --notes-file build/release-notes.md
          fi

      - name: Publish appcast to gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          BUILD_NUMBER=$(git rev-list --count HEAD)
          DMG_PATH="build/${DISPLAY_NAME}-${VERSION}.dmg"
          DMG_SIZE=$(stat -f%z "$DMG_PATH")
          DOWNLOAD_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${DISPLAY_NAME}-${VERSION}.dmg"
          RELEASE_NOTES_URL="https://rmarinsky.github.io/Diduny/release-notes/${VERSION}.md"
          ED_SIGNATURE=$(echo "$SPARKLE_SIGN_OUTPUT" | sed -n 's/.*sparkle:edSignature="\([^"]*\)".*/\1/p')
          ED_LENGTH=$(echo "$SPARKLE_SIGN_OUTPUT" | sed -n 's/.*length="\([^"]*\)".*/\1/p')

          # The Sparkle feed lives on the dedicated, unprotected gh-pages
          # branch — never on main. A worktree isolates it from the tag checkout.
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages:gh-pages
          git worktree add /tmp/ghpages gh-pages

          mkdir -p /tmp/ghpages/release-notes
          cp build/release-notes.md "/tmp/ghpages/release-notes/${VERSION}.md"
          python3 scripts/release_highlights.py upsert-appcast /tmp/ghpages/appcast.xml \
            --version "$VERSION" \
            --build-number "$BUILD_NUMBER" \
            --download-url "$DOWNLOAD_URL" \
            --signature "$ED_SIGNATURE" \
            --length "${ED_LENGTH:-$DMG_SIZE}" \
            --release-notes-url "$RELEASE_NOTES_URL"

          cd /tmp/ghpages
          if [ -z "$(git status --porcelain -- appcast.xml "release-notes/${VERSION}.md")" ]; then
            echo "Release notes and appcast unchanged — nothing to publish"
          else
            git add appcast.xml "release-notes/${VERSION}.md"
            git commit -m "Publish release notes for ${GITHUB_REF_NAME}"
            git push origin gh-pages
            echo "Published ${GITHUB_REF_NAME} notes and Sparkle feed (gh-pages)"
          fi

      - name: Cleanup signing artifacts
        if: always()
        run: |
          security delete-keychain "$KEYCHAIN_NAME" || true
          rm -f certificate.p12 "build/${APP_NAME}-notary.zip"
