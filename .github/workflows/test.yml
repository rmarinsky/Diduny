name: Tests

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -switch /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Generate Xcode project (XcodeGen)
        run: |
          brew install xcodegen
          xcodegen generate --quiet

      # Ad-hoc signing: CI has no Developer ID certificate. The Test config
      # skips bundling the remote media runtime (SKIP_REMOTE_MEDIA_RUNTIME).
      - name: Run unit tests
        run: |
          set -o pipefail
          mkdir -p build/screenshots
          # TEST_RUNNER_ variables reach the test process without the prefix.
          TEST_RUNNER_SCREENSHOT_DIR="$PWD/build/screenshots" \
          xcodebuild test \
            -project Diduny.xcodeproj \
            -derivedDataPath build/DerivedData \
            -scheme "Diduny DEV" \
            -destination "platform=macOS,arch=arm64" \
            -resultBundlePath build/TestResults.xcresult \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM= \
            ONLY_ACTIVE_ARCH=YES \
            | tee build/xcodebuild-test.log | grep -E "error:|warning: .*failed|Test Case .*(failed|passed)|Executed|\*\* TEST" || true
          grep -q "\*\* TEST SUCCEEDED \*\*" build/xcodebuild-test.log

      - name: Test summary
        if: always()
        run: |
          {
            echo "## Unit tests"
            echo "- XCTest: $(grep -E 'Executed [0-9]+ tests' build/xcodebuild-test.log | tail -1 | sed 's/^[[:space:]]*//')"
            echo "- Swift Testing: $(grep -E 'Test run with [0-9]+ tests' build/xcodebuild-test.log | tail -1 | sed 's/^[^T]*//')"
            if grep -q "Failing tests:" build/xcodebuild-test.log; then
              echo "### Failing tests"
              sed -n '/^Failing tests:/,/^\*\* TEST/p' build/xcodebuild-test.log | grep -vE "Failing tests:|\*\* TEST|^$" | sed 's/^[[:space:]]*/- /'
            fi
            echo "Screenshots and the ad-hoc signed app are attached as run artifacts."
          } >> "$GITHUB_STEP_SUMMARY"

      # The test action builds the Test configuration, so the app is "Diduny TEST.app".
      - name: Package the app
        if: always()
        run: |
          app=$(find build/DerivedData/Build/Products -maxdepth 2 -name "Diduny*.app" -type d | head -1)
          echo "Packaging: ${app:-none found}"
          [ -n "$app" ] && ditto -c -k --keepParent "$app" "build/Diduny-app.zip" || true

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: build/screenshots
          if-no-files-found: ignore

      - name: Upload the app
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Diduny-app
          path: build/Diduny-app.zip
          if-no-files-found: ignore

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            build/TestResults.xcresult
            build/xcodebuild-test.log
          if-no-files-found: ignore
